<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Design | AI Chats | Ava Portfolio</title>
    <link rel="icon" type="image/png" href="../assets/images/logo1.png">
    <link rel="apple-touch-icon" href="../assets/images/logo1.png">
    <link rel="stylesheet" href="../About/style.css">
    <link rel="stylesheet" href="../stylemenu.css">
    <link rel="stylesheet" href="../globalstyles.css">
    <style>
        .showcase-backdrop { top: 100px;position: absolute;width: 100%;height: auto; background-color: #C8E0FE;}
        .showcase-content {
            max-width: 720px;
            margin: 0 auto;
        }
        .showcase-content h1 {
            color: #133670;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }
        .showcase-lead { font-size: 1.1rem; color: #212c3e; margin-bottom: 2rem; padding-bottom: 10px;}
        .showcase-link-button {
            display: inline-block;
            background-color: #212c3e;
            color: #e3e8f1;
            padding: 0.65rem 1rem;
            border-radius: 8px;
            text-decoration: none;
            text-align: center;
            font-weight: 600;
            transition: background-color 0.2s ease;
            width: 40%;
            display: flex;
            justify-content: center;
            justify-self: anchor-center;
        }
        .showcase-link-button:hover {
            background-color: #0f2b59;
        }
        /* Override global About/style.css `p` (1.2rem serif) so body text + inline code read correctly */
        .showcase-content code { background: rgba(0,0,0,.06); padding: 0.15em 0.4em; border-radius: 4px; }
        .showcase-section { margin-bottom: 2rem; }
        .showcase-section h2 { color: #212c3e; font-size: 1.35rem; margin-bottom: 0.5rem; padding: 0; background: transparent; }
        .showcase-section p, .showcase-section ul { color: #212c3e; text-align: left; padding: 0 0 0.5rem; margin: 0; background: transparent; }
        .showcase-section p code,
        .showcase-section li code { font-size: 0.875rem; }
        .showcase-section ul { padding-left: 1.5rem; }
        .showcase-code {
            background: #212c3e;
            color: #e8e8e8;
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            margin: 0.75rem 0;
            font-size: 0.9rem;
        }
        .showcase-code code { background: transparent; padding: 0; color: inherit; font-size: inherit; }
        .showcase-media-note { margin-bottom: 0.75rem; }
        .showcase-media-image {
            width: 80%;
            height: auto;
            border-radius: 8px;
            border: 1px solid rgba(19,54,112,0.2);
            display: flex;
            justify-self: center;
        }
        .showcase-links {
            margin-top: 1.25rem;
        }
    </style>
</head>

<body>
    <script src="../menu.js"></script>
    <div class="showcase-backdrop">
        <main class="showcase-content">
            <h1>System Design</h1>
            <p class="showcase-lead">
                Conversations with AI where I work through system design problems: requirements, trade-offs, and architecture.
            </p>

            <section class="showcase-section">
                <h2>Chats</h2>
                <p>
                    Coming soon.
                </p>
            </section>
        </main>
    </div>
</body>

</html>
